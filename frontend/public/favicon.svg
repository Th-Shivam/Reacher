  <rect x="18" y="13" width="18" height="6" rx="3" fill="#fdfcf8" />
  <circle cx="35" cy="27" r="14" fill="#fdfcf8" />
  <circle cx="35" cy="27" r="8.5" fill="#111113" />
  <path d="M30 36.5 36 34l18 17-5 5z" fill="#fdfcf8" />

  <!-- Purple research lens doubles as the R's counter. -->
  <circle cx="35" cy="27" r="7.5" fill="#8b6cff" />
  <circle cx="35" cy="27" r="4.25" fill="#111113" />
  <path d="m40 31 3-3 7 7-3 3z" fill="#8b6cff" />
