<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <title>Reacher</title>
  <rect width="64" height="64" rx="14" fill="#111113" />

  <!-- Motion lines from the Reacher product mark. -->
  <rect x="7" y="18" width="10" height="3.5" rx="1.75" fill="#fdfcf8" />
  <rect x="9" y="25" width="8" height="3.5" rx="1.75" fill="#fdfcf8" />

  <!-- Compact R monogram, derived from the full research-and-outreach logo. -->
